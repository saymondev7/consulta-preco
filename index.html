<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Preço - Sol Materiais</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f4f4; color: #222; }
  header { background: #f5a300; color: #fff; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .busca { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font-size: 18px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; }
  input:focus { border-color: #f5a300; outline: none; }
  button { font-size: 16px; padding: 12px 16px; border: 0; border-radius: 8px; background: #222; color: #fff; cursor: pointer; }
  #btnCamera { width: 100%; margin-top: 10px; background: #f5a300; }
  #reader { margin-top: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .desc { font-size: 20px; font-weight: 600; }
  .cod { color: #777; font-size: 14px; margin-top: 4px; }
  .preco { font-size: 44px; font-weight: bold; color: #1a7f37; margin: 16px 0 12px; }
  .estoque { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .estoque div { background: #f4f4f4; border-radius: 8px; padding: 10px; text-align: center; }
  .estoque span { display: block; font-size: 12px; color: #777; }
  .estoque b { font-size: 20px; }
  .estoque .zero b { color: #c62828; }
  .ficha { margin-top: 16px; border-top: 1px solid #eee; padding-top: 12px; }
  .ficha summary { font-weight: 600; cursor: pointer; color: #b37400; }
  .ficha dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0 0; font-size: 14px; }
  .ficha dt { color: #777; }
  .ficha dd { margin: 0; }
  .ficha p { font-size: 14px; margin: 10px 0 0; line-height: 1.4; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
          background: #fff; color: #222; padding: 14px; border-bottom: 1px solid #eee; border-radius: 0; }
  .item:last-child { border-bottom: 0; }
  .item .nome { font-weight: 600; font-size: 15px; }
  .item .sub { color: #777; font-size: 13px; margin-top: 2px; }
  .item .valor { font-weight: bold; color: #1a7f37; white-space: nowrap; }
  .lista { padding: 0; overflow: hidden; }
  .aviso { padding: 12px 14px; font-size: 13px; color: #777; background: #fafafa; }
  .voltar { background: transparent; color: #f5a300; padding: 0; margin-bottom: 12px; font-weight: 600; }
  .erro { color: #c62828; font-weight: 600; }
  .info { color: #777; text-align: center; }
  .aviso-legal { font-size: 12px; color: #888; margin-top: 14px; line-height: 1.4; }
  footer { max-width: 560px; margin: 8px auto 24px; padding: 0 16px; font-size: 12px; color: #999; text-align: center; line-height: 1.4; }
</style>
</head>
<body>
<header>Consulta de Preço</header>
<main>
  <div class="busca">
    <input id="busca" type="search" placeholder="Código, referência, EAN ou descrição" autofocus autocomplete="off">
    <button id="btnBuscar">OK</button>
  </div>
  <button id="btnCamera">📷 Ler com a câmera</button>
  <div id="reader"></div>
  <div id="resultado" class="card info">Bipe, digite o código ou pesquise pela descrição.</div>
</main>
<footer>
  As informações exibidas são apenas para consulta e podem sofrer alterações.
  Valores, disponibilidade e especificações devem ser confirmados com a equipe da Sol Materiais.
</footer>

<script>
  const API = 'https://autowebhook.saymon.space/webhook/api/preco';
  const LIMITE = 20;
  const campo = document.getElementById('busca');
  const resultado = document.getElementById('resultado');
  const btnCamera = document.getElementById('btnCamera');
  let scanner = null;
  let ultimaLeitura = null;
  let lista = [];

  const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const num = v => Number(v ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const pega = (o, k) => o[k] ?? o[k.toUpperCase()];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const rotulo = s => { s = s.trim().toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };

  // Monta a ficha técnica a partir do texto do DADOSTECNICOS
  // Linhas "CAMPO: valor" viram tabela; linhas sem rótulo viram parágrafo
  function fichaHtml(texto) {
    const linhas = String(texto || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (!linhas.length) return '';
    const itens = [], soltos = [];
    for (const l of linhas) {
      const i = l.indexOf(':');
      if (i > 0 && i <= 30) itens.push([l.slice(0, i), l.slice(i + 1).trim()]);
      else soltos.push(l);
    }
    return `
      <details class="ficha" open>
        <summary>Ficha técnica</summary>
        ${itens.length ? `<dl>${itens.map(([k, v]) => `<dt>${esc(rotulo(k))}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
        ${soltos.map(t => `<p>${esc(t)}</p>`).join('')}
      </details>`;
  }

  // Localização: exigida pelo n8n para liberar a consulta (só dentro das lojas)
  // maximumAge reaproveita a última posição por 2 min para não pedir GPS a cada busca
  function pegarLocalizacao() {
    return new Promise((ok, falha) => {
      if (!navigator.geolocation) { falha({ code: 0 }); return; }
      navigator.geolocation.getCurrentPosition(
        p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
        falha,
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
      );
    });
  }

  const erroLocalizacao = e => ({
    1: 'Permita o acesso à localização para consultar preços.',
    2: 'Não foi possível obter sua localização. Ative o GPS e tente novamente.',
    3: 'A localização demorou para responder. Tente novamente.'
  }[e?.code] || 'Seu navegador não permite obter a localização.');

  // Localização negada: o navegador não mostra o pop-up de novo sozinho,
  // então explica como liberar no aparelho e oferece tentar de novo
  function ajudaLocalizacao(termo) {
    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const chromeIos = /CriOS/.test(ua);
    const passos = ios
      ? (chromeIos
          ? ['Abra <b>Ajustes → Apps → Chrome → Localização</b> e marque <b>Durante o Uso</b>.']
          : ['Abra <b>Ajustes → Privacidade e Segurança → Serviços de Localização</b> e deixe ligado.',
             'Na mesma tela, em <b>Sites do Safari</b>, marque <b>Durante o Uso</b> e ligue <b>Localização Precisa</b>.',
             'Volte aqui, toque no menu ao lado do endereço (<b>☰</b> ou <b>aA</b>) → <b>Ajustes do Site → Localização → Permitir</b>.'])
      : ['Toque no cadeado <b>🔒</b> ao lado do endereço do site.',
         'Em <b>Permissões → Localização</b>, escolha <b>Permitir</b>.',
         'Confira se a localização (GPS) do celular está ligada.'];
    resultado.className = 'card';
    resultado.innerHTML = `
      <div class="erro">Permita o acesso à localização para consultar preços.</div>
      <ol style="font-size:14px;line-height:1.5;padding-left:20px;margin:12px 0">${passos.map(p => `<li>${p}</li>`).join('')}</ol>
      <button id="btnTentar" style="width:100%;background:#f5a300">Tentar novamente</button>`;
    document.getElementById('btnTentar').onclick = () => consultar(termo);
  }

  function mensagem(texto, classe) {
    resultado.className = 'card ' + classe;
    resultado.textContent = texto;
  }

  async function consultar(termo) {
    termo = String(termo).trim();
    if (termo.length < 2) { mensagem('Digite ao menos 2 caracteres.', 'erro'); return; }
    mensagem('Consultando...', 'info');
    let loc;
    try {
      loc = await pegarLocalizacao();
    } catch (e) {
      if (e?.code === 1) ajudaLocalizacao(termo);
      else mensagem(erroLocalizacao(e), 'erro');
      return;
    }
    try {
      const params = new URLSearchParams({ q: termo, lat: loc.lat, lng: loc.lng, acc: loc.acc });
      const r = await fetch(API + '?' + params);
      let d = await r.json();
      if (!Array.isArray(d)) d = [d];
      if (!r.ok || d[0]?.erro) { mensagem(d[0]?.erro || 'Erro na consulta.', 'erro'); return; }
      lista = d.filter(x => pega(x, 'descricao'));
      if (!lista.length) mensagem('Nada encontrado para "' + termo + '".', 'erro');
      else if (lista.length === 1) detalhe(0);
      else mostrarLista();
    } catch (e) {
      mensagem('Erro ao consultar. Tente novamente.', 'erro');
    } finally {
      campo.select();
    }
  }

  function mostrarLista() {
    resultado.className = 'card lista';
    resultado.innerHTML = lista.map((p, i) => `
      <button class="item" onclick="detalhe(${i})">
        <div>
          <div class="nome">${esc(pega(p, 'descricao'))}</div>
          <div class="sub">${pega(p, 'marca') ? esc(pega(p, 'marca')) + ' · ' : ''}Cód. ${esc(pega(p, 'codprod'))}</div>
        </div>
        <div class="valor">${brl(pega(p, 'preco'))}</div>
      </button>`).join('') +
      (lista.length >= LIMITE
        ? `<div class="aviso">Mostrando os ${LIMITE} primeiros. Refine a busca para encontrar mais rápido.</div>`
        : '');
  }

  function detalhe(i) {
    const p = lista[i];
    // Só mostra o estoque das lojas que o n8n devolveu (as da região do cliente)
    const est = (nome, chave) => {
      const bruto = pega(p, chave);
      if (bruto === null || bruto === undefined) return '';
      const v = Number(bruto);
      return `<div class="${v <= 0 ? 'zero' : ''}"><span>${nome}</span><b>${num(v)}</b></div>`;
    };
    const estoques = [est('Matriz', 'est_matriz'), est('Filial CJ', 'est_cj'), est('Filial Canaã', 'est_canaa')].filter(Boolean);
    const ref = pega(p, 'codfab');
    const ficha = fichaHtml(pega(p, 'dadostecnicos'));
    const agora = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    resultado.className = 'card';
    resultado.innerHTML = `
      ${lista.length > 1 ? '<button class="voltar" onclick="mostrarLista()">← Voltar à lista</button>' : ''}
      <div class="desc">${esc(pega(p, 'descricao'))}</div>
      <div class="cod">
        ${pega(p, 'marca') ? esc(pega(p, 'marca')) + ' · ' : ''}Cód. ${esc(pega(p, 'codprod'))}${ref ? ' · Ref. ' + esc(ref) : ''}
      </div>
      <div class="preco">${brl(pega(p, 'preco'))} <small style="font-size:16px;color:#777">/ ${esc(pega(p, 'unidade'))}</small></div>
      ${estoques.length ? `<div class="estoque" style="grid-template-columns:repeat(${estoques.length},1fr)">${estoques.join('')}</div>` : ''}
      ${ficha}
      <div class="aviso-legal">
        Consultado em ${agora}. Preço e estoque sujeitos a alteração sem aviso prévio.
        ${ficha ? 'Especificações conforme dados do fabricante. ' : ''}Confirme com um de nossos consultores antes de finalizar a compra.
      </div>`;
  }

  // Valida dígito verificador de EAN-8, UPC-A e EAN-13
  const eanValido = c => {
    if (!/^\d{8}$|^\d{12,13}$/.test(c)) return false;
    const d = c.split('').map(Number);
    const dv = d.pop();
    const soma = d.reverse().reduce((s, n, i) => s + n * (i % 2 === 0 ? 3 : 1), 0);
    return (10 - (soma % 10)) % 10 === dv;
  };

  async function pararCamera() {
    if (scanner) {
      try { await scanner.stop(); } catch (e) {}
      scanner = null;
    }
    btnCamera.textContent = '📷 Ler com a câmera';
  }

  document.getElementById('btnBuscar').onclick = () => consultar(campo.value);
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') consultar(campo.value); });

  btnCamera.onclick = async () => {
    if (scanner) { await pararCamera(); return; }
    ultimaLeitura = null;
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A
      ],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 15, qrbox: { width: 300, height: 120 }, aspectRatio: 1.777 },
        async texto => {
          if (!eanValido(texto)) return;
          if (texto !== ultimaLeitura) { ultimaLeitura = texto; return; }
          await pararCamera();
          if (navigator.vibrate) navigator.vibrate(100);
          campo.value = texto;
          consultar(texto);
        }
      );
      btnCamera.textContent = '✖ Fechar câmera';
    } catch (e) {
      scanner = null;
      mensagem('Não foi possível abrir a câmera.', 'erro');
    }
  };
</script>
</body>
</html>
